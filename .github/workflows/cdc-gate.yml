# Consumer-driven contracts (CDC) gate — J05, PLATFORM_ARCHITECTURE.md § 4.5 (M2).
#
# "A provider change that breaks any published consumer expectation fails the
# provider's CI." scripts/ci/cdc-harness.mjs already does the real work
# (replays every consumer's committed cdc/expectations.json against the
# calling provider's actual exported surface) — it was simply never wired
# into any workflow anywhere (confirmed: zero matches for "cdc-harness"
# across every .github/workflows/*.yml in this whole polyrepo before this
# phase) and its own PROVIDERS/CONSUMERS table still named pre-split monorepo
# paths (apps/web, packages/sdk) that stopped existing the moment this
# platform split into 30 repositories — so even a manual run found nothing.
#
# Reusable so any provider repo can call it, the same "the gate comes to the
# code" pattern policy-gate.yml already uses. Checks out unierp-workspace
# (for the script) plus every sibling provider/consumer repo the harness
# itself declares, so a caller needs to supply nothing but its own checkout.
#
# Called like this, from a provider repo (e.g. unierp-design-system):
#
#   jobs:
#     cdc:
#       uses: kannan19302/unierp-workspace/.github/workflows/cdc-gate.yml@main

name: CDC gate

on:
  workflow_call: {}

jobs:
  cdc:
    runs-on: ubuntu-latest
    steps:
      # Checked out under its OWN real name — critically, this is the
      # commit/PR actually under test, not a fresh clone of that repo's
      # main branch. The clone loop below skips this name for exactly that
      # reason: cloning over it would silently replace the change being
      # verified with whatever is already on main, and the gate would
      # verify nothing.
      - name: Check out the calling provider (the commit under test)
        uses: actions/checkout@v4
        with:
          path: unierp-workspace-siblings/${{ github.event.repository.name }}

      - name: Check out the CDC harness
        uses: actions/checkout@v4
        with:
          repository: kannan19302/unierp-workspace
          path: unierp-workspace-siblings/unierp-workspace

      # Every OTHER provider and consumer the harness declares, cloned
      # (not actions/checkout — a matrix would fan this step out into
      # separate parallel JOBS, each with only one repo, when this gate
      # needs all of them present together in one job) into the same
      # sibling layout the harness's own path resolution expects.
      # `|| true` per repo: a repo that has since been renamed or removed
      # should not fail every OTHER provider's CI — the harness itself
      # already reports an "open surface" warning, not a hard failure, for
      # a provider it cannot find.
      - name: Check out the other CDC providers and consumers
        run: |
          for repo in \
            unierp-contracts unierp-kernel unierp-sdk unierp-extension-api \
            unierp-sandbox unierp-framework unierp-data unierp-shared \
            unierp-auth unierp-design-system unierp-web unierp-console \
            unierp-developer unierp-api unierp-idp unierp-extensions; do
            if [ "$repo" = "${{ github.event.repository.name }}" ]; then
              continue
            fi
            git clone --depth 1 "https://github.com/kannan19302/${repo}.git" \
              "unierp-workspace-siblings/${repo}" || true
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the harness's own dependency (typescript)
        working-directory: unierp-workspace-siblings/unierp-workspace
        run: npm install typescript@5.9.3 --no-save

      - name: CDC gate — replay every consumer expectation against this provider
        working-directory: unierp-workspace-siblings/unierp-workspace
        run: node scripts/ci/cdc-harness.mjs
