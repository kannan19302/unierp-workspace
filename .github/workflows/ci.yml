# CI — unierp-workspace. docs/ai/TRD.md § 8, Layer 3.
#
# CONTRACT: no code with a failing check reaches main, and nothing merges red.
# There is deliberately NO `continue-on-error` anywhere in this file. A gate that cannot
# fail is worse than no gate — it manufactures false confidence.
#
# ── Phase A30 / defects D024, D025 ──────────────────────────────────────────────────
# This file used to be the MONOREPO's CI, inherited whole at extraction. Five of its eight
# jobs — static, supply-chain, test, build, e2e — ran 27 package-manager steps in a
# repository that has NO package.json and NO application source. Not one could ever have
# passed, and because they all declared needs: guard they sat permanently "skipped" behind
# a guard job that was itself failing. main had been red since 2026-08-05.
#
# Removing them is not weakening a gate: those gates never ran here. But they must run
# SOMEWHERE, and today they largely do not — every repo's own ci.yml is a hand copy (D019)
# and unierp-api's runs only an install step. That gap is D025 and phase A31, filed rather
# than silently absorbed into a green build.
#
# What remains is what this repository can actually verify: the orchestration gates over
# its own contents, and CodeQL over its own scripts. Gates that read application source
# travel to the code via .github/workflows/policy-gate.yml (reusable), which the owning
# repositories call and scripts/ci/check-policy-coverage.mjs proves they call.
# ────────────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Tier 1 — cheap gates. Seconds. Fail fast, before anything expensive runs.
  # ─────────────────────────────────────────────────────────────────────────
  guard:
    name: Guard (secrets · suppressions · policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (working tree)
        run: node scripts/ci/check-secrets.mjs --all

      - name: Suppression ratchet
        run: node scripts/ci/check-suppressions.mjs

      - name: Policy gate
        run: node scripts/ci/check-policy.mjs

      - name: Decimal arithmetic ratchet
        run: node scripts/ci/check-decimal-arithmetic.mjs

      - name: docs/ai integrity
        run: |
          count=$(ls -1 docs/ai | wc -l)
          if [ "$count" -ne 10 ]; then
            echo "::error::docs/ai must contain exactly 10 files, found $count."
            echo "See docs/ai/README.md rule 1 — no sidecar documents."
            ls -1 docs/ai
            exit 1
          fi
          echo "✅ docs/ai holds exactly 10 master files"

      # BLOCKING, and deliberately NOT guarded by `if: hashFiles(...)`. That guard is
      # exactly how the layer gate came to be declared in 21 repositories and present
      # in none (docs/programme/90-DEFECT-LOG.md D013) — a step that passes by being
      # absent. If this script is missing, this job must fail.
      #
      # Enforces docs/programme/README.md § 0: a phase ID is permanent, a plan document
      # is never regenerated or truncated, no phase loses its exit criterion, and no
      # undeclared file enters the folder.
      - name: Development programme integrity
        run: node scripts/check-plan-integrity.mjs

      # BLOCKING. Phase A14, closing R5. Fifteen scratch files were tracked at
      # unierp-mobile's root, three of which had already been deleted once in the monorepo
      # and returned through the polyrepo extraction — a fix that does not survive
      # extraction needs a mechanism, not a second cleanup. Allowlist, not denylist: a
      # denylist catches fix_router_5.py and misses fix_router_6.py.
      - name: Repository hygiene
        run: node scripts/ci/check-repo-hygiene.mjs

      - name: Documentation truth gate
        run: node scripts/check-doc-truth.mjs

      - name: Architecture audit
        run: node scripts/ci/audit-architecture.mjs

      # BLOCKING. Phase A30 / D024. check-policy.mjs delegates a rule to the repository
      # that owns its files — this asserts each of those repositories actually runs the
      # gate and carries a committed ratchet baseline. Without it, delegation becomes a
      # way of enforcing nothing everywhere, which is how a clean 0 came to sit over 309
      # hardcoded hex values, 2,315 hardcoded pixels and 22 Float money columns.
      - name: Policy-gate coverage
        run: node scripts/ci/check-policy-coverage.mjs

      # BLOCKING. Added after this very file was broken by a YAML round-trip that turned
      # `on:` into `true:` — GitHub then reported only "workflow file issue" with no failing
      # step and no log. Also catches a step guarded by `if: hashFiles(...)`, which passes by
      # being absent (D013: 21 repos declared a gate whose script existed in none).
      - name: Workflow files are runnable
        run: node scripts/ci/check-workflows.mjs

      - name: CHANGELOG updated
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^docs/ai/CHANGELOG.md$'; then
            echo "✅ CHANGELOG entry present"
          else
            echo "::error::Every change needs one line in docs/ai/CHANGELOG.md. No exceptions for small changes."
            exit 1
          fi

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [guard, codeql]
    if: always()
    steps:
      - name: Verify every gate succeeded
        run: |
          results="${{ needs.guard.result }} ${{ needs.codeql.result }}"
          echo "Gate results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required gate did not succeed ($r). Red builds are never merged."
              exit 1
            fi
          done
          echo "All required gates succeeded."
